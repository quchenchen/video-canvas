server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # nginx 默认只放行 1MB 请求体，超过会直接断开连接；技能包导入（zip 最大 50MB、文件夹合计最大 100MB）
        # 和素材中转上传都会超过它。上限与后端保持一致，真正的大小校验仍由后端负责
        client_max_body_size 110m;
        # 大文件边收边转给后端，不先落到 nginx 的临时文件
        proxy_request_buffering off;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /files/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 带 hash 的静态资源可长缓存；index.html 必须不缓存，否则发布会引用到已删除的旧文件
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 兼容历史产物目录：老版本构建把资源放在 /assets/ 下，该路径同时是业务路由。
    # 若确实不存在该文件则回落到 index.html，交给前端路由处理。
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        # 不能带 $uri/：目录命中会让 nginx 走目录索引（403），SPA 路由必须回落到 index.html
        try_files $uri /index.html;
    }
}
